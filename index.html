<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Multi Twitch</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#0e0e10;color:#efeff1;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.box{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
form{width:100%;max-width:340px;background:#18181b;border:1px solid #2c2c35;border-radius:18px;padding:22px 20px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
h1{margin:0 0 4px;font-size:22px;font-weight:800}
h1 span{color:#9146ff}
p{margin:0 0 16px;color:#a0a0ab;font-size:14px}
input[type=password]{box-sizing:border-box;width:100%;padding:12px 14px;border-radius:12px;border:1px solid #3a3a46;background:#0e0e14;color:#fff;font-size:16px;outline:none}
input[type=password]:focus{border-color:#9146ff}
label{display:flex;gap:8px;align-items:center;margin:12px 2px 16px;color:#c8c8d0;font-size:14px}
label input{accent-color:#9146ff;width:17px;height:17px;margin:0}
button{width:100%;padding:12px;border:0;border-radius:12px;background:#9146ff;color:#fff;font-size:16px;font-weight:700}
button:disabled{opacity:.6}
.err{color:#ff6b7f;font-size:13px;min-height:18px;margin:-6px 2px 8px}
</style></head><body>
<div class="box"><form id="f" hidden>
<h1>Multi <span>Twitch</span></h1><p>Enter the password to open it.</p>
<input type="password" id="pw" autocomplete="current-password" autofocus required>
<label><input type="checkbox" id="keep" checked>Remember on this device</label>
<div class="err" id="err"></div>
<button id="go">Open</button>
</form></div>

const bu = b => btoa(String.fromCharCode(...new Uint8Array(b)));
