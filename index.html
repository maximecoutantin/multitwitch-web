  if (saved) { try { await open(ub(saved)); return; } catch (e) { try { localStorage.removeItem(KEY); } catch (e2) {} } }
  const f = document.getElementById('f'); f.hidden = false;
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const go = document.getElementById('go'), err = document.getElementById('err');
    go.disabled = true; err.textContent = '';
    try {
      const raw = await derive(document.getElementById('pw').value);
      await (async () => {
        const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
        await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(D.i) }, key, ub(D.c));
      })();
      if (document.getElementById('keep').checked) { try { localStorage.setItem(KEY, bu(raw)); } catch (e) {} }
      await open(raw);
    } catch (e2) { err.textContent = 'Wrong password'; go.disabled = false; }
  });
})();
</script></body></html>
