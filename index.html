  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(D.i) }, key, ub(D.c));
  const html = await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: ub(D.s), iterations: D.n }, base, 256);
}
const KEY = 'mt_unlock_' + D.s.slice(0, 8);
(async () => {
  let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) { try { await open(ub(saved)); return; } catch (e) { try { localStorage.removeItem(KEY); } catch (e2) {} } }
  const f = document.getElementById('f'); f.hidden = false;
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const go = document.getElementById('go'), err = document.getElementById('err');
    go.disabled = true; err.textContent = '';
    try {
      const raw = await derive(document.getElementById('pw').value);
      await (async () => {
        const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
        await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(D.i) }, key, ub(D.c));
      })();
      if (document.getElementById('keep').checked) { try { localStorage.setItem(KEY, bu(raw)); } catch (e) {} }
      await open(raw);
    } catch (e2) { err.textContent = 'Wrong password'; go.disabled = false; }
  });
})();
